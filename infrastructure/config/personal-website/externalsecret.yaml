---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: personal-website-database
  namespace: personal-website
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: personal-website-database
    creationPolicy: Owner
    template:
      data:
        DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@postgres-cluster-rw.databases.svc.cluster.local:5432/{{ .dbname }}"
  data:
    - secretKey: username
      remoteRef:
        key: secret/data/kubernetes/personal-website/database
        property: username
    - secretKey: password
      remoteRef:
        key: secret/data/kubernetes/personal-website/database
        property: password
    - secretKey: dbname
      remoteRef:
        key: secret/data/kubernetes/personal-website/database
        property: dbname
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: personal-website-vllm
  namespace: personal-website
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: personal-website-vllm
    creationPolicy: Owner
  data:
    - secretKey: VLLM_API_KEY
      remoteRef:
        key: secret/data/kubernetes/personal-website/vllm
        property: api-key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: personal-website-smtp
  namespace: personal-website
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: personal-website-smtp
    creationPolicy: Owner
    template:
      data:
        SMTP_HOST: "{{ .host }}"
        SMTP_PORT: "{{ .port }}"
        SMTP_USER: "{{ .username }}"
        SMTP_PASSWORD: "{{ .password }}"
  data:
    - secretKey: host
      remoteRef:
        key: secret/data/mailserver/smtp-service
        property: host
    - secretKey: port
      remoteRef:
        key: secret/data/mailserver/smtp-service
        property: port
    - secretKey: username
      remoteRef:
        key: secret/data/mailserver/smtp-service
        property: username
    - secretKey: password
      remoteRef:
        key: secret/data/mailserver/smtp-service
        property: password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: personal-website-auth
  namespace: personal-website
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: personal-website-auth
    creationPolicy: Owner
  data:
    - secretKey: AUTH_SECRET
      remoteRef:
        key: secret/data/kubernetes/personal-website/auth
        property: auth-secret
    - secretKey: ADMIN_EMAIL
      remoteRef:
        key: secret/data/kubernetes/personal-website/auth
        property: admin-email
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nexus-registry-credentials
  namespace: personal-website
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: nexus-registry-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"nexus.bsdserver.nl:443":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: secret/data/nexus/cicd
        property: username
    - secretKey: password
      remoteRef:
        key: secret/data/nexus/cicd
        property: password
