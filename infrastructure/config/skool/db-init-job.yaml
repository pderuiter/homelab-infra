---
# One-time job to create the skool database and user on the shared CNPG cluster
apiVersion: batch/v1
kind: Job
metadata:
  name: skool-db-init-v4
  namespace: skool
  labels:
    app.kubernetes.io/name: skool
    app.kubernetes.io/component: db-init
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: ghcr.io/cloudnative-pg/postgresql:16.4
          command: ["sh", "-c"]
          args:
            - |
              set -e
              PG_HOST="postgres-cluster-rw.databases.svc.cluster.local"

              echo "Waiting for database to be reachable..."
              for i in $(seq 1 30); do
                if pg_isready -h "$PG_HOST" -p 5432 2>/dev/null; then
                  break
                fi
                echo "Attempt $i/30 — waiting 5s..."
                sleep 5
              done

              echo "Creating skool database and user via app owner..."
              PGPASSWORD="$APP_PASSWORD" psql -h "$PG_HOST" -U "$APP_USERNAME" -d app <<'EOSQL'
              DO $$
              BEGIN
                IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'skool') THEN
                  CREATE ROLE skool WITH LOGIN PASSWORD 'placeholder';
                END IF;
              END
              $$;
              EOSQL

              # Set the real password (from Vault secret)
              PGPASSWORD="$APP_PASSWORD" psql -h "$PG_HOST" -U "$APP_USERNAME" -d app -c \
                "ALTER ROLE skool WITH PASSWORD '$DB_PASSWORD';"

              # Create database if not exists
              DB_EXISTS=$(PGPASSWORD="$APP_PASSWORD" psql -h "$PG_HOST" -U "$APP_USERNAME" -d app -tAc \
                "SELECT 1 FROM pg_database WHERE datname = '$DB_DATABASE'")
              if [ "$DB_EXISTS" != "1" ]; then
                PGPASSWORD="$APP_PASSWORD" psql -h "$PG_HOST" -U "$APP_USERNAME" -d app -c \
                  "CREATE DATABASE $DB_DATABASE OWNER skool;"
                echo "Database '$DB_DATABASE' created."
              else
                echo "Database '$DB_DATABASE' already exists."
              fi

              PGPASSWORD="$APP_PASSWORD" psql -h "$PG_HOST" -U "$APP_USERNAME" -d app -c \
                "GRANT ALL PRIVILEGES ON DATABASE $DB_DATABASE TO skool;"

              echo "Database init complete."
          envFrom:
            - secretRef:
                name: skool-db-credentials
          env:
            - name: APP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-app-crossns
                  key: username
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-app-crossns
                  key: password
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
---
# Copy the app credentials from Vault (CNPG bootstrap owner with CREATEDB)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-app-crossns
  namespace: skool
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: postgres-app-crossns
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: secret/data/kubernetes/postgres/app
        property: username
    - secretKey: password
      remoteRef:
        key: secret/data/kubernetes/postgres/app
        property: password
