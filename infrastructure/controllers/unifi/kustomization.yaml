---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - externalsecret.yaml
  - unpoller.yaml
  - exporter-deployment.yaml
  - exporter-service.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml
  # Grafana dashboards (auto-imported by grafana sidecar via label).
  # 11311 sites, 11312 switches (USW), 11313 gateway (USG),
  # 11314 access points (UAP), 11315 clients.
  - dashboards/unifi-sites-configmap.yaml
  - dashboards/unifi-switches-configmap.yaml
  - dashboards/unifi-gateway-configmap.yaml
  - dashboards/unifi-uap-configmap.yaml
  - dashboards/unifi-clients-configmap.yaml
