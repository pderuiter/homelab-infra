apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../controllers/sealed-secrets
  - ../../controllers/external-secrets
  - ../../controllers/metallb
  - ../../controllers/cert-manager
  - ../../controllers/external-dns
  # external-dns-transip: ExternalSecret moved to config phase (needs ESO CRDs)
  - external-dns-transip-namespace.yaml
  - external-dns-transip-deployment.yaml
  # Traefik: Certificate/IngressRoute moved to config phase (needs cert-manager/Traefik CRDs)
  - traefik-namespace.yaml
  - traefik-helmrepository.yaml
  - traefik-helmrelease.yaml
  - traefik-api-service.yaml

patches:
  # MetalLB: speaker needs privileged PodSecurity (NET_ADMIN, NET_RAW, SYS_ADMIN, hostNetwork)
  - target:
      kind: Namespace
      name: metallb-system
    patch: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: metallb-system
        labels:
          pod-security.kubernetes.io/enforce: privileged
          pod-security.kubernetes.io/audit: privileged
          pod-security.kubernetes.io/warn: privileged

  # Traefik: remove control-plane exclusion, set talos01 loadBalancerIP, disable metrics
  - target:
      kind: HelmRelease
      name: traefik
      namespace: traefik
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: traefik
        namespace: traefik
      spec:
        values:
          affinity: null
          service:
            spec:
              loadBalancerIP: 192.168.2.21
          metrics:
            prometheus:
              service:
                enabled: false
              serviceMonitor:
                enabled: false

  # External DNS: scale to 0 until Vault auth provides rfc2136-credentials secret
  - target:
      kind: Deployment
      name: external-dns
      namespace: external-dns
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: external-dns
        namespace: external-dns
      spec:
        replicas: 0

  # External DNS TransIP: scale to 0 until Vault auth provides transip-credentials secret
  - target:
      kind: Deployment
      name: external-dns-transip
      namespace: external-dns-transip
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: external-dns-transip
        namespace: external-dns-transip
      spec:
        replicas: 0

  # Sealed Secrets: remove control-plane exclusion, disable ServiceMonitor
  - target:
      kind: HelmRelease
      name: sealed-secrets
      namespace: sealed-secrets
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: sealed-secrets
        namespace: sealed-secrets
      spec:
        values:
          affinity: null
          metrics:
            serviceMonitor:
              enabled: false
