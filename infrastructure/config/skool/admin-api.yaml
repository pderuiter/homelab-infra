---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-api
  namespace: skool
  labels:
    app.kubernetes.io/name: skool
    app.kubernetes.io/component: admin-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: skool
      app.kubernetes.io/component: admin-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skool
        app.kubernetes.io/component: admin-api
    spec:
      imagePullSecrets:
        - name: skool-registry-credentials
      containers:
        - name: admin-api
          image: nexus.bsdserver.nl/docker-registry/wbyc/docker-skool-admin_api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4001
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: ADMIN_API_PORT
              value: "4001"
            - name: REDIS_URL
              value: redis://redis.skool.svc.cluster.local:6379
          envFrom:
            - secretRef:
                name: skool-db-credentials
            - secretRef:
                name: skool-api-secrets
            - secretRef:
                name: skool-pipeline-secrets
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
---
# Internal-only service (no Ingress — only accessible within cluster)
apiVersion: v1
kind: Service
metadata:
  name: admin-api
  namespace: skool
  labels:
    app.kubernetes.io/name: skool
    app.kubernetes.io/component: admin-api
spec:
  selector:
    app.kubernetes.io/name: skool
    app.kubernetes.io/component: admin-api
  ports:
    - port: 4001
      targetPort: http
      name: http
