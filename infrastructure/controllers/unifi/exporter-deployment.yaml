---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unifi-update-exporter
  namespace: unifi
  labels:
    app.kubernetes.io/name: unifi-update-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: unifi-update-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unifi-update-exporter
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: nexus.bsdserver.nl/docker-registry/unifi-update-exporter:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9131
          env:
            - name: UNIFI_HOST
              valueFrom:
                secretKeyRef:
                  name: unifi-credentials
                  key: UNIFI_HOST
            - name: UNIFI_USER
              valueFrom:
                secretKeyRef:
                  name: unifi-credentials
                  key: UNIFI_USER
            - name: UNIFI_PASS
              valueFrom:
                secretKeyRef:
                  name: unifi-credentials
                  key: UNIFI_PASS
            - name: POLL_INTERVAL
              value: "300"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
