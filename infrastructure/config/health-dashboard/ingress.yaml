apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: health-dashboard
  namespace: health-dashboard
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: health-dashboard-internal-only@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - health.bsdserver.nl
      secretName: health-dashboard-tls
  rules:
    - host: health.bsdserver.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: health-dashboard
                port:
                  name: http
