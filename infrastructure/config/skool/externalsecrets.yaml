---
# Database credentials (for Skool DB user on shared CNPG cluster)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: skool-db-credentials
  namespace: skool
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: skool-db-credentials
    creationPolicy: Owner
    template:
      data:
        DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@postgres-cluster-pooler-rw.databases.svc.cluster.local:5432/{{ .database }}"
        DB_USERNAME: "{{ .username }}"
        DB_PASSWORD: "{{ .password }}"
        DB_DATABASE: "{{ .database }}"
  data:
    - secretKey: username
      remoteRef:
        key: secret/data/kubernetes/skool/database
        property: username
    - secretKey: password
      remoteRef:
        key: secret/data/kubernetes/skool/database
        property: password
    - secretKey: database
      remoteRef:
        key: secret/data/kubernetes/skool/database
        property: database
---
# API secrets (JWT, WEB_URL)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: skool-api-secrets
  namespace: skool
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: skool-api-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: secret/data/kubernetes/skool/api
        property: jwt-secret
    - secretKey: JWT_ISSUER
      remoteRef:
        key: secret/data/kubernetes/skool/api
        property: jwt-issuer
    - secretKey: WEB_URL
      remoteRef:
        key: secret/data/kubernetes/skool/api
        property: web-url
---
# Stripe secrets
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: skool-stripe-secrets
  namespace: skool
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: skool-stripe-secrets
    creationPolicy: Owner
  data:
    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        key: secret/data/kubernetes/skool/stripe
        property: secret-key
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef:
        key: secret/data/kubernetes/skool/stripe
        property: webhook-secret
---
# S3/MinIO secrets
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: skool-s3-secrets
  namespace: skool
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: skool-s3-secrets
    creationPolicy: Owner
  data:
    - secretKey: S3_ENDPOINT
      remoteRef:
        key: secret/data/kubernetes/skool/s3
        property: endpoint
    - secretKey: S3_REGION
      remoteRef:
        key: secret/data/kubernetes/skool/s3
        property: region
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: secret/data/kubernetes/skool/s3
        property: access-key
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: secret/data/kubernetes/skool/s3
        property: secret-key
    - secretKey: S3_BUCKET
      remoteRef:
        key: secret/data/kubernetes/skool/s3
        property: bucket
    - secretKey: S3_PUBLIC_ENDPOINT
      remoteRef:
        key: secret/data/kubernetes/skool/s3
        property: public-endpoint
---
# Docker registry credentials for pulling images from Nexus
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: skool-registry-credentials
  namespace: skool
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: skool-registry-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ .dockerconfig }}"
  data:
    - secretKey: dockerconfig
      remoteRef:
        key: secret/data/kubernetes/skool/registry
        property: docker-config
---
# SMTP credentials for email sending
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: skool-smtp-secrets
  namespace: skool
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: skool-smtp-secrets
    creationPolicy: Owner
  data:
    - secretKey: SMTP_HOST
      remoteRef:
        key: secret/data/kubernetes/skool/smtp
        property: host
    - secretKey: SMTP_PORT
      remoteRef:
        key: secret/data/kubernetes/skool/smtp
        property: port
    - secretKey: SMTP_USERNAME
      remoteRef:
        key: secret/data/kubernetes/skool/smtp
        property: username
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: secret/data/kubernetes/skool/smtp
        property: password
    - secretKey: EMAIL_FROM
      remoteRef:
        key: secret/data/kubernetes/skool/smtp
        property: from
