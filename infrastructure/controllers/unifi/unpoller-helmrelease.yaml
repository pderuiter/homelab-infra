---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unpoller
  namespace: unifi
spec:
  interval: 30m
  chart:
    spec:
      chart: unpoller
      version: "2.15.x"
      sourceRef:
        kind: HelmRepository
        name: unpoller
        namespace: unifi
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      repository: ghcr.io/unpoller/unpoller
      tag: v2.15.3
      pullPolicy: IfNotPresent

    # Read unifi creds from the ExternalSecret-managed secret
    extraEnv:
      - name: UP_UNIFI_DEFAULT_USER
        valueFrom:
          secretKeyRef:
            name: unifi-credentials
            key: UNIFI_USER
      - name: UP_UNIFI_DEFAULT_PASS
        valueFrom:
          secretKeyRef:
            name: unifi-credentials
            key: UNIFI_PASS
      - name: UP_UNIFI_DEFAULT_URL
        value: "https://10.69.2.1"
      - name: UP_UNIFI_DEFAULT_VERIFY_SSL
        value: "false"
      - name: UP_UNIFI_DEFAULT_SAVE_SITES
        value: "true"
      - name: UP_UNIFI_DEFAULT_SAVE_DPI
        value: "false"
      - name: UP_POLLER_DEBUG
        value: "false"
      # Prometheus output, not influx
      - name: UP_PROMETHEUS_DISABLE
        value: "false"
      - name: UP_PROMETHEUS_HTTP_LISTEN
        value: "0.0.0.0:9130"
      - name: UP_INFLUXDB_DISABLE
        value: "true"

    service:
      type: ClusterIP
      port: 9130
      targetPort: 9130

    # Let the chart create its own ServiceMonitor — port name is
    # template-managed so this avoids name-mismatch hassle.
    serviceMonitor:
      enabled: true
      interval: 60s
      additionalLabels:
        release: kube-prometheus-stack

    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      seccompProfile:
        type: RuntimeDefault

    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      readOnlyRootFilesystem: true
