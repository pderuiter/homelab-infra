---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubevious
  namespace: kubevious
spec:
  interval: 30m
  chart:
    spec:
      chart: kubevious
      version: "1.2.1"
      sourceRef:
        kind: HelmRepository
        name: kubevious
        namespace: kubevious
      interval: 12h
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # MySQL backend configuration
    mysql:
      persistence:
        enabled: true
        storageClass: longhorn
        size: 10Gi
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

    # Backend configuration
    backend:
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

    # Parser configuration
    parser:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

    # UI configuration
    ui:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

    # Collector configuration - 512Mi limit caused repeated OOMKills (469 restarts on worker01)
    collector:
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi

    # Guard configuration - actual usage: 1m CPU, 38Mi memory
    guard:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi

    # Redis configuration - actual usage: 15m CPU, 48Mi memory
    redis:
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi

    # Ingress configuration
    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-production
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
      hosts:
        - host: kubevious.bsdserver.nl
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: kubevious-tls
          hosts:
            - kubevious.bsdserver.nl

    # ServiceMonitor for Prometheus
    serviceMonitor:
      enabled: true

  # Chart hardcodes liveness/readiness with no initialDelay; guard takes ~30s+
  # to load all processors and was being SIGTERM'd mid-init. Inject a generous
  # startupProbe so liveness only kicks in after the app is actually ready.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: kubevious-guard
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/startupProbe
                value:
                  httpGet:
                    path: /
                    port: http
                  periodSeconds: 5
                  failureThreshold: 60
                  timeoutSeconds: 3
