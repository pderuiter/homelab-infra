apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: observability
spec:
  interval: 30m
  chart:
    spec:
      chart: alloy
      version: "0.x"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: observability
  values:
    alloy:
      configMap:
        content: |
          // Add cluster label to all metrics
          discovery.relabel "cluster_label" {
            targets = []
            rule {
              target_label = "cluster"
              replacement  = "talos01"
            }
          }

          // Discover Kubernetes pods for log collection
          discovery.kubernetes "pods" {
            role = "pod"
          }

          // Relabel pod logs with standard labels + cluster
          discovery.relabel "pods" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app"]
              target_label  = "app"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              target_label  = "app_name"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node"
            }
            rule {
              target_label = "cluster"
              replacement  = "talos01"
            }
          }

          // Collect pod logs
          loki.source.kubernetes "pods" {
            targets    = discovery.relabel.pods.output
            forward_to = [loki.write.default.receiver]
          }

          // Collect Kubernetes events as logs
          loki.source.kubernetes_events "events" {
            forward_to = [loki.write.default.receiver]
          }

          // Send logs to Loki on wbyc-k8s
          loki.write "default" {
            endpoint {
              url = "https://loki.bsdserver.nl/loki/api/v1/push"
              tls_config {
                insecure_skip_verify = true
              }
            }
            external_labels = {
              cluster = "talos01",
            }
          }

          // Scrape kubelet cadvisor metrics
          discovery.kubernetes "nodes" {
            role = "node"
          }

          discovery.relabel "kubelet" {
            targets = discovery.kubernetes.nodes.targets
            rule {
              target_label = "__address__"
              replacement  = "kubernetes.default.svc:443"
            }
            rule {
              source_labels = ["__meta_kubernetes_node_name"]
              regex         = "(.+)"
              target_label  = "__metrics_path__"
              replacement   = "/api/v1/nodes/$1/proxy/metrics/cadvisor"
            }
            rule {
              target_label = "cluster"
              replacement  = "talos01"
            }
          }

          prometheus.scrape "kubelet" {
            targets         = discovery.relabel.kubelet.output
            scheme          = "https"
            scrape_interval = "30s"
            bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
            tls_config {
              ca_file              = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
              insecure_skip_verify = true
            }
            forward_to = [prometheus.relabel.cluster_label.receiver]
          }

          // Add cluster label to all scraped metrics
          prometheus.relabel "cluster_label" {
            rule {
              target_label = "cluster"
              replacement  = "talos01"
            }
            forward_to = [prometheus.remote_write.default.receiver]
          }

          // Remote write metrics to Prometheus on wbyc-k8s
          prometheus.remote_write "default" {
            endpoint {
              url = "https://prometheus.bsdserver.nl/api/v1/write"
              tls_config {
                insecure_skip_verify = true
              }
            }
          }

    controller:
      type: daemonset

    serviceAccount:
      create: true

    rbac:
      create: true

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

    extraMounts:
      - name: varlog
        mountPath: /var/log
        hostPath:
          path: /var/log
          type: Directory
        readOnly: true
