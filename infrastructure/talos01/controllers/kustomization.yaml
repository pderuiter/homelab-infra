apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../controllers/sealed-secrets
  - ../../controllers/external-secrets
  - ../../controllers/metallb
  - ../../controllers/cert-manager
  - ../../controllers/external-dns
  - ../../controllers/local-path-provisioner
  - ../../controllers/metrics-server
  # external-dns-transip: ExternalSecret moved to config phase (needs ESO CRDs)
  - external-dns-transip-namespace.yaml
  - external-dns-transip-deployment.yaml
  # Traefik: Certificate/IngressRoute moved to config phase (needs cert-manager/Traefik CRDs)
  - traefik-namespace.yaml
  - traefik-helmrepository.yaml
  - traefik-helmrelease.yaml
  - traefik-api-service.yaml

patches:
  # MetalLB: speaker needs privileged PodSecurity (NET_ADMIN, NET_RAW, SYS_ADMIN, hostNetwork)
  - target:
      kind: Namespace
      name: metallb-system
    patch: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: metallb-system
        labels:
          pod-security.kubernetes.io/enforce: privileged
          pod-security.kubernetes.io/audit: privileged
          pod-security.kubernetes.io/warn: privileged

  # Traefik: remove control-plane exclusion, set talos01 loadBalancerIP, disable metrics
  - target:
      kind: HelmRelease
      name: traefik
      namespace: traefik
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: traefik
        namespace: traefik
      spec:
        values:
          affinity: null
          service:
            spec:
              loadBalancerIP: 192.168.2.21
          metrics:
            prometheus:
              service:
                enabled: false
              serviceMonitor:
                enabled: false

  # External-DNS: unique owner ID, upsert-only policy, PodSecurity compliance
  - target:
      kind: Deployment
      name: external-dns
      namespace: external-dns
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - --source=service
          - --source=ingress
          - --source=traefik-proxy
          - --traefik-disable-legacy
          - --provider=rfc2136
          - --rfc2136-host=192.168.2.2
          - --rfc2136-port=53
          - --rfc2136-zone=bsdserver.nl
          - --rfc2136-tsig-axfr
          - --domain-filter=bsdserver.nl
          - --policy=upsert-only
          - --registry=txt
          - --txt-owner-id=external-dns-talos01
          - --txt-prefix=_externaldns.
          - --log-level=info
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
      - op: add
        path: /spec/template/spec/securityContext
        value:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault

  # Sealed Secrets: remove control-plane exclusion, disable ServiceMonitor
  - target:
      kind: HelmRelease
      name: sealed-secrets
      namespace: sealed-secrets
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: sealed-secrets
        namespace: sealed-secrets
      spec:
        values:
          affinity: null
          metrics:
            serviceMonitor:
              enabled: false
