apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nexus-data
  namespace: nexus
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus
  namespace: nexus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nexus
  template:
    metadata:
      labels:
        app: nexus
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 200
        runAsGroup: 200
        fsGroup: 200
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: install-keycloak-plugin
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              PLUGIN_VERSION="0.5.0"
              PLUGIN_URL="https://github.com/flytreeleft/nexus3-keycloak-plugin/releases/download/v${PLUGIN_VERSION}/nexus3-keycloak-plugin-${PLUGIN_VERSION}-bundle.kar"
              if [ ! -f /nexus-data/deploy/nexus3-keycloak-plugin-${PLUGIN_VERSION}-bundle.kar ]; then
                mkdir -p /nexus-data/deploy
                wget -O /nexus-data/deploy/nexus3-keycloak-plugin-${PLUGIN_VERSION}-bundle.kar "$PLUGIN_URL"
                echo "Keycloak plugin downloaded"
              else
                echo "Keycloak plugin already present"
              fi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /nexus-data
      containers:
        - name: nexus
          image: sonatype/nexus3:3.88.0
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: INSTALL4J_ADD_VM_PARAMS
              value: "-Xms512m -Xmx1024m -XX:MaxDirectMemorySize=1g -Djava.util.prefs.userRoot=/nexus-data/javaprefs"
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /nexus-data
            - name: keycloak-config
              mountPath: /opt/sonatype/nexus/etc/keycloak.json
              subPath: keycloak.json
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /service/rest/v1/status
              port: http
            initialDelaySeconds: 180
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /service/rest/v1/status
              port: http
            initialDelaySeconds: 120
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nexus-data
        - name: keycloak-config
          secret:
            secretName: nexus-keycloak
---
apiVersion: v1
kind: Service
metadata:
  name: nexus
  namespace: nexus
spec:
  selector:
    app: nexus
  ports:
    - name: http
      port: 8081
      targetPort: http
