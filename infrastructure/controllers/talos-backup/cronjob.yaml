apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: talos-backup-secrets
  namespace: talos-backup
spec:
  roles:
    - os:etcd:backup
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: talos-backup
  namespace: talos-backup
spec:
  schedule: "0 */6 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        spec:
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          tolerations:
            - key: "node-role.kubernetes.io/control-plane"
              operator: "Exists"
              effect: "NoSchedule"
          restartPolicy: OnFailure
          volumes:
            - name: talos-config
              emptyDir: {}
            - name: tmp
              emptyDir: {}
            - name: talos-secrets
              secret:
                secretName: talos-backup-secrets
          containers:
            - name: talos-backup
              image: ghcr.io/siderolabs/talos-backup:v0.1.0-beta.3
              workingDir: /tmp
              command:
                - /talos-backup
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                seccompProfile:
                  type: RuntimeDefault
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: talos-config
                  mountPath: /.talos
                - name: tmp
                  mountPath: /tmp
                - name: talos-secrets
                  mountPath: /var/run/secrets/talos.dev
              envFrom:
                - secretRef:
                    name: talos-backup-credentials
              env:
                - name: BUCKET
                  value: talos-backup
                - name: AWS_REGION
                  value: us-east-1
                - name: CUSTOM_S3_ENDPOINT
                  value: https://minio-k8s.bsdserver.nl
                - name: CLUSTER_NAME
                  value: talos01
                - name: ENABLE_COMPRESSION
                  value: "true"
                # Inverted logic in talos-backup: "false" enables path-style S3 addressing
                - name: USE_PATH_STYLE
                  value: "false"
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
