---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: skool
  labels:
    app.kubernetes.io/name: skool
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: skool
      app.kubernetes.io/component: api
  minReadySeconds: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skool
        app.kubernetes.io/component: api
    spec:
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: skool-registry-credentials
      containers:
        - name: api
          image: nexus.bsdserver.nl/docker-registry/wbyc/docker-skool-api:latest
          imagePullPolicy: Always
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "4000"
            - name: REDIS_URL
              value: redis://redis.skool.svc.cluster.local:6379
          envFrom:
            - secretRef:
                name: skool-db-api-credentials
            - secretRef:
                name: skool-api-secrets
            - secretRef:
                name: skool-stripe-secrets
            - secretRef:
                name: skool-s3-secrets
            - secretRef:
                name: skool-smtp-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: skool
                    app.kubernetes.io/component: api
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: skool
  labels:
    app.kubernetes.io/name: skool
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: skool
    app.kubernetes.io/component: api
  ports:
    - port: 4000
      targetPort: http
      name: http
