---
# ServiceAccount used by maintenance CronJobs to exec into the CNPG primary pod.
# CNPG has enableSuperuserAccess: false, so password auth as 'postgres' is
# disabled. Maintenance uses peer auth via kubectl exec inside the pod instead.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-maintenance
  namespace: databases
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: postgres-maintenance
  namespace: databases
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: postgres-maintenance
  namespace: databases
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: postgres-maintenance
subjects:
  - kind: ServiceAccount
    name: postgres-maintenance
    namespace: databases
---
# VACUUM ANALYZE CronJob - runs daily
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-vacuum-analyze
  namespace: databases
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: maintenance
spec:
  # Daily at 4:00 AM UTC (after backup completes)
  schedule: "0 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres
            app.kubernetes.io/component: maintenance
        spec:
          restartPolicy: Never
          serviceAccountName: postgres-maintenance
          containers:
            - name: vacuum-analyze
              image: alpine/k8s:1.31.0
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  echo "Starting VACUUM ANALYZE on all databases..."

                  # Find the CNPG primary pod (retry to absorb startup races)
                  for i in $(seq 1 30); do
                    PRIMARY=$(kubectl get pods -n databases \
                      -l cnpg.io/cluster=postgres-cluster,cnpg.io/instanceRole=primary \
                      -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
                    if [ -n "$PRIMARY" ]; then
                      echo "Primary pod: $PRIMARY"
                      break
                    fi
                    echo "Waiting for CNPG primary (attempt $i/30)..."
                    sleep 5
                    if [ "$i" -eq 30 ]; then
                      echo "ERROR: no primary pod found after 150s"; exit 1
                    fi
                  done

                  exec_psql() {
                    kubectl exec -n databases -c postgres "$PRIMARY" -- psql -U postgres "$@"
                  }

                  DATABASES=$(exec_psql -d postgres -tAc \
                    "SELECT datname FROM pg_database WHERE datistemplate = false AND datname != 'postgres';")

                  for DB in $DATABASES; do
                    if [ -n "$DB" ]; then
                      echo "Running VACUUM ANALYZE on database: $DB"
                      exec_psql -d "$DB" -c "VACUUM (VERBOSE, ANALYZE);" \
                        || echo "Warning: VACUUM ANALYZE failed for $DB"
                    fi
                  done

                  echo "VACUUM ANALYZE completed!"
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
---
# REINDEX CronJob - runs weekly
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-reindex
  namespace: databases
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: maintenance
spec:
  # Weekly on Sunday at 5:00 AM UTC
  schedule: "0 5 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres
            app.kubernetes.io/component: maintenance
        spec:
          restartPolicy: Never
          serviceAccountName: postgres-maintenance
          containers:
            - name: reindex
              image: alpine/k8s:1.31.0
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  echo "Starting REINDEX on all databases..."

                  for i in $(seq 1 30); do
                    PRIMARY=$(kubectl get pods -n databases \
                      -l cnpg.io/cluster=postgres-cluster,cnpg.io/instanceRole=primary \
                      -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
                    if [ -n "$PRIMARY" ]; then
                      echo "Primary pod: $PRIMARY"
                      break
                    fi
                    echo "Waiting for CNPG primary (attempt $i/30)..."
                    sleep 5
                    if [ "$i" -eq 30 ]; then
                      echo "ERROR: no primary pod found after 150s"; exit 1
                    fi
                  done

                  exec_psql() {
                    kubectl exec -n databases -c postgres "$PRIMARY" -- psql -U postgres "$@"
                  }

                  DATABASES=$(exec_psql -d postgres -tAc \
                    "SELECT datname FROM pg_database WHERE datistemplate = false AND datname != 'postgres';")

                  for DB in $DATABASES; do
                    if [ -n "$DB" ]; then
                      echo "Running REINDEX on database: $DB"
                      exec_psql -d "$DB" -c "REINDEX DATABASE \"$DB\";" \
                        || echo "Warning: REINDEX failed for $DB"
                    fi
                  done

                  echo "REINDEX completed!"
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
---
# pg_stat_statements reset - monthly
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-stats-reset
  namespace: databases
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: maintenance
spec:
  # Monthly on 1st at 6:00 AM UTC
  schedule: "0 6 1 * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres
            app.kubernetes.io/component: maintenance
        spec:
          restartPolicy: Never
          serviceAccountName: postgres-maintenance
          containers:
            - name: stats-reset
              image: alpine/k8s:1.31.0
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  echo "Resetting pg_stat_statements..."

                  for i in $(seq 1 30); do
                    PRIMARY=$(kubectl get pods -n databases \
                      -l cnpg.io/cluster=postgres-cluster,cnpg.io/instanceRole=primary \
                      -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
                    if [ -n "$PRIMARY" ]; then break; fi
                    echo "Waiting for CNPG primary (attempt $i/30)..."
                    sleep 5
                    if [ "$i" -eq 30 ]; then
                      echo "ERROR: no primary pod found after 150s"; exit 1
                    fi
                  done

                  kubectl exec -n databases -c postgres "$PRIMARY" -- \
                    psql -U postgres -d postgres -c "SELECT pg_stat_statements_reset();" \
                    || echo "Warning: pg_stat_statements_reset failed"

                  echo "Stats reset completed!"
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
