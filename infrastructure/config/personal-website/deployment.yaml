apiVersion: apps/v1
kind: Deployment
metadata:
  name: personal-website
  namespace: personal-website
  labels:
    app.kubernetes.io/name: personal-website
    app.kubernetes.io/component: web
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: personal-website
  template:
    metadata:
      labels:
        app.kubernetes.io/name: personal-website
        app.kubernetes.io/component: web
    spec:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        runAsNonRoot: true
      imagePullSecrets:
        - name: nexus-registry-credentials
      initContainers:
        - name: wait-for-db
          image: postgres:17-alpine
          command:
            - sh
            - -c
            - until pg_isready -h postgres-cluster-rw.databases.svc.cluster.local -p 5432; do echo "waiting for postgres"; sleep 2; done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
        - name: migrate
          image: nexus.bsdserver.nl:443/docker-registry/personal-website:0.1.0-placeholder
          command: ["node", "migrate.mjs"]
          envFrom:
            - secretRef:
                name: personal-website-database
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: web
          image: nexus.bsdserver.nl:443/docker-registry/personal-website:0.1.0-placeholder
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: VLLM_BASE_URL
              value: https://vllm.bsdserver.nl/v1
            - name: VLLM_MODEL
              value: qwen2.5-7b-instruct
            - name: AUTH_URL
              value: https://portfolio.bsdserver.nl
            - name: AUTH_TRUST_HOST
              value: "true"
            - name: SMTP_FROM
              value: portfolio@bsdserver.nl
          envFrom:
            - secretRef:
                name: personal-website-database
            - secretRef:
                name: personal-website-vllm
            - secretRef:
                name: personal-website-smtp
            - secretRef:
                name: personal-website-auth
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
