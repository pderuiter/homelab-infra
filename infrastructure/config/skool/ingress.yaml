---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: skool
  namespace: skool
  labels:
    app.kubernetes.io/name: skool
    app.kubernetes.io/component: ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # skool migrated to Docker Compose on wbyc-srv-docker04 (2026-06-13).
    # The PUBLIC record (skool.bsdserver.nl A 85.10.201.85) is now a manual
    # TransIP entry — the "external: true" annotation is intentionally gone so
    # the public external-dns-transip instance (annotation-filter external=true)
    # releases it. The INTERNAL external-dns (rfc2136 -> 192.168.2.2, no
    # annotation filter) still manages this ingress, so we override its target
    # to the docker04 host below so LAN clients also resolve to the new home.
    # Rollback: remove the target override + re-add external:true (-> Pangolin),
    # restore replicas, and delete the manual public A/AAAA records.
    external-dns.alpha.kubernetes.io/target: 85.10.201.85
spec:
  ingressClassName: traefik
  rules:
    - host: skool.bsdserver.nl
      http:
        paths:
          # API routes
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
          # Pipeline routes (course ingest + group lookup).
          # Secured by pipelineAuthMiddleware (X-Pipeline-Token header).
          - path: /api/pipeline
            pathType: Prefix
            backend:
              service:
                name: admin-api
                port:
                  name: http
          # Admin panel routes (stats, user management).
          # Secured by adminAuthMiddleware (JWT).
          - path: /api/admin
            pathType: Prefix
            backend:
              service:
                name: admin-api
                port:
                  name: http
          # WebSocket/Socket.IO route
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: realtime
                port:
                  name: http
          # Everything else goes to Next.js web app
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
  tls:
    - hosts:
        - skool.bsdserver.nl
      secretName: skool-tls
