---
# One-time job to create the restricted skool_api role and apply RLS policies.
# The API should connect as skool_api (not skool) for production RLS enforcement.
# Bump the version suffix to re-run after adding new RLS policies.
apiVersion: batch/v1
kind: Job
metadata:
  name: skool-db-rls-setup-v5
  namespace: skool
  labels:
    app.kubernetes.io/name: skool
    app.kubernetes.io/component: db-rls-setup
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 1
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: rls-setup
          image: ghcr.io/cloudnative-pg/postgresql:16.4
          command: ["sh", "-c"]
          args:
            - |
              set -e
              PG_HOST="postgres-cluster-rw.databases.svc.cluster.local"

              echo "Waiting for database..."
              until PGPASSWORD="$APP_PASSWORD" psql -h "$PG_HOST" -U "$APP_USERNAME" -d "$DB_DATABASE" -c "SELECT 1" >/dev/null 2>&1; do
                sleep 5
              done

              export PGPASSWORD="$APP_PASSWORD"
              PSQL="psql -h $PG_HOST -U $APP_USERNAME -d $DB_DATABASE"

              echo "=== Creating skool_api restricted role ==="
              ROLE_EXISTS=$($PSQL -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'skool_api'")
              if [ "$ROLE_EXISTS" != "1" ]; then
                $PSQL -c "CREATE ROLE skool_api WITH LOGIN PASSWORD '$API_DB_PASSWORD';"
                echo "Role 'skool_api' created."
              else
                $PSQL -c "ALTER ROLE skool_api WITH PASSWORD '$API_DB_PASSWORD';"
                echo "Role 'skool_api' exists, password updated."
              fi

              echo "=== Granting connect and schema usage (as app superuser) ==="
              $PSQL -c "GRANT CONNECT ON DATABASE $DB_DATABASE TO skool_api;"
              $PSQL -c "GRANT USAGE ON SCHEMA public TO skool_api;"

              echo "=== Granting table/sequence/function permissions (as skool owner) ==="
              export PGPASSWORD="$DB_PASSWORD"
              PSQL_OWNER="psql -h $PG_HOST -U $DB_USERNAME -d $DB_DATABASE"
              $PSQL_OWNER -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO skool_api;"
              $PSQL_OWNER -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO skool_api;"
              $PSQL_OWNER -c "GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO skool_api;"
              $PSQL_OWNER -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO skool_api;"
              $PSQL_OWNER -c "GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO skool_api;"
              $PSQL_OWNER -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT EXECUTE ON FUNCTIONS TO skool_api;"

              echo "=== Enabling RLS on all tables ==="
              TABLES=$($PSQL_OWNER -tAc "SELECT tablename FROM pg_tables WHERE schemaname = 'public' AND tablename NOT LIKE '_%'")
              for TABLE in $TABLES; do
                $PSQL_OWNER -c "ALTER TABLE $TABLE ENABLE ROW LEVEL SECURITY;"
                $PSQL_OWNER -c "ALTER TABLE $TABLE FORCE ROW LEVEL SECURITY;"
                echo "  RLS enabled on: $TABLE"
              done

              echo "=== Applying RLS policies from migration files ==="
              # The security_hardening and complete_rls_policies migrations contain the policies
              # They use IF NOT EXISTS patterns so re-running is safe
              echo "RLS policies should be applied via db-migrate-job (migrations 0006, 0007)"

              echo "=== Verifying ==="
              $PSQL_OWNER -c "SELECT tablename, rowsecurity FROM pg_tables WHERE schemaname = 'public' AND tablename NOT LIKE '_%' ORDER BY tablename;"

              echo "RLS setup complete."
              echo ""
              echo "IMPORTANT: Update the API deployment to use the skool-db-api-credentials secret"
              echo "instead of skool-db-credentials to connect as skool_api."
          envFrom:
            - secretRef:
                name: skool-db-credentials
          env:
            - name: APP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-app-crossns
                  key: username
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-app-crossns
                  key: password
            - name: API_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: skool-db-api-credentials
                  key: DB_PASSWORD
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
---
# ExternalSecret for the restricted skool_api database credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: skool-db-api-credentials
  namespace: skool
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: skool-db-api-credentials
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/data/kubernetes/skool/db-api
        property: database_url
    - secretKey: DB_USERNAME
      remoteRef:
        key: secret/data/kubernetes/skool/db-api
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: secret/data/kubernetes/skool/db-api
        property: password
    - secretKey: DB_DATABASE
      remoteRef:
        key: secret/data/kubernetes/skool/db-api
        property: database
