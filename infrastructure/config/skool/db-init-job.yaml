---
# One-time job to create the skool database and user on the shared CNPG cluster
apiVersion: batch/v1
kind: Job
metadata:
  name: skool-db-init-v6
  namespace: skool
  labels:
    app.kubernetes.io/name: skool
    app.kubernetes.io/component: db-init
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: ghcr.io/cloudnative-pg/postgresql:16.4
          command: ["sh", "-c"]
          args:
            - |
              set -e
              PG_HOST="postgres-cluster-rw.databases.svc.cluster.local"

              echo "Waiting for database to be reachable..."
              until PGPASSWORD="$APP_PASSWORD" psql -h "$PG_HOST" -U "$APP_USERNAME" -d app -c "SELECT 1" >/dev/null 2>&1; do
                echo "Waiting 5s for database..."
                sleep 5
              done
              echo "Database is reachable."

              echo "Creating skool database and user via app owner..."
              export PGPASSWORD="$APP_PASSWORD"
              PSQL="psql -h $PG_HOST -U $APP_USERNAME -d app"

              # Create role if not exists (use simple check to avoid $$ escaping)
              ROLE_EXISTS=$($PSQL -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'skool'")
              if [ "$ROLE_EXISTS" != "1" ]; then
                $PSQL -c "CREATE ROLE skool WITH LOGIN PASSWORD '$DB_PASSWORD';"
                echo "Role 'skool' created."
              else
                $PSQL -c "ALTER ROLE skool WITH PASSWORD '$DB_PASSWORD';"
                echo "Role 'skool' already exists, password updated."
              fi

              # Create database if not exists
              DB_EXISTS=$($PSQL -tAc "SELECT 1 FROM pg_database WHERE datname = '$DB_DATABASE'")
              if [ "$DB_EXISTS" != "1" ]; then
                $PSQL -c "CREATE DATABASE $DB_DATABASE OWNER skool;"
                echo "Database '$DB_DATABASE' created."
              else
                echo "Database '$DB_DATABASE' already exists."
              fi

              $PSQL -c "GRANT ALL PRIVILEGES ON DATABASE $DB_DATABASE TO skool;"
              echo "Database init complete."
          envFrom:
            - secretRef:
                name: skool-db-credentials
          env:
            - name: APP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-app-crossns
                  key: username
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-app-crossns
                  key: password
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
---
# Copy the app credentials from Vault (CNPG bootstrap owner with CREATEDB)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-app-crossns
  namespace: skool
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: postgres-app-crossns
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: secret/data/kubernetes/postgres/app
        property: username
    - secretKey: password
      remoteRef:
        key: secret/data/kubernetes/postgres/app
        property: password
