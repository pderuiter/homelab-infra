apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: netbird
  namespace: netbird
  labels:
    app.kubernetes.io/name: netbird
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: netbird
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netbird
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: netbird
          image: netbirdio/netbird:0.66.3
          env:
            - name: NB_SETUP_KEY
              valueFrom:
                secretKeyRef:
                  name: netbird
                  key: NB_SETUP_KEY
            - name: NB_MANAGEMENT_URL
              valueFrom:
                secretKeyRef:
                  name: netbird
                  key: NB_MANAGEMENT_URL
            - name: NB_LOG_FILE
              value: console
            - name: NB_DAEMON_ADDR
              value: unix:///var/run/netbird.sock
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - SYS_ADMIN
                - SYS_RESOURCE
          volumeMounts:
            - name: config
              mountPath: /etc/netbird
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: config
          hostPath:
            path: /var/lib/netbird
            type: DirectoryOrCreate
      tolerations:
        - operator: Exists
