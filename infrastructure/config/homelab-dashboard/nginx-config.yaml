apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: homelab-dashboard
data:
  nginx.conf: |
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /tmp/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';

        access_log /var/log/nginx/access.log main;

        sendfile on;
        keepalive_timeout 65;
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

        # Use /tmp for temp files (for non-root)
        client_body_temp_path /tmp/client_temp;
        proxy_temp_path /tmp/proxy_temp;
        fastcgi_temp_path /tmp/fastcgi_temp;
        uwsgi_temp_path /tmp/uwsgi_temp;
        scgi_temp_path /tmp/scgi_temp;

        server {
            listen 8080;
            server_name _;
            root /usr/share/nginx/html;
            index index.html;

            # Trust Traefik and pod network to pass real client IP
            set_real_ip_from 10.244.0.0/16;
            set_real_ip_from 10.96.0.0/16;
            real_ip_header X-Forwarded-For;
            real_ip_recursive on;

            # Main site
            location / {
                try_files $uri $uri/ /index.html;
            }

            # Proxy to Prometheus for metrics (internal networks only)
            location /api/prometheus/ {
                # Allow internal networks
                allow 192.168.2.0/24;
                allow 192.168.178.0/24;
                allow 10.244.0.0/16;
                allow 100.118.0.0/16;
                deny all;

                proxy_pass http://kube-prometheus-stack-prometheus.observability.svc:9090/;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # Health check
            location /healthz {
                return 200 'OK';
                add_header Content-Type text/plain;
            }
        }
    }
