---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: skool
  namespace: skool
  labels:
    app.kubernetes.io/name: skool
    app.kubernetes.io/component: ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # external-dns annotations removed 2026-06-13: skool migrated to Docker
    # Compose on wbyc-srv-docker04. skool.bsdserver.nl now points directly at
    # the host (A 85.10.201.85) via TransIP. Re-add these two lines to roll
    # back DNS to the K8s/Pangolin path.
    # external-dns.alpha.kubernetes.io/external: "true"
    # external-dns.alpha.kubernetes.io/target: wbyc-srv-vpn01.bsdserver.nl
spec:
  ingressClassName: traefik
  rules:
    - host: skool.bsdserver.nl
      http:
        paths:
          # API routes
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
          # Pipeline routes (course ingest + group lookup).
          # Secured by pipelineAuthMiddleware (X-Pipeline-Token header).
          - path: /api/pipeline
            pathType: Prefix
            backend:
              service:
                name: admin-api
                port:
                  name: http
          # Admin panel routes (stats, user management).
          # Secured by adminAuthMiddleware (JWT).
          - path: /api/admin
            pathType: Prefix
            backend:
              service:
                name: admin-api
                port:
                  name: http
          # WebSocket/Socket.IO route
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: realtime
                port:
                  name: http
          # Everything else goes to Next.js web app
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
  tls:
    - hosts:
        - skool.bsdserver.nl
      secretName: skool-tls
