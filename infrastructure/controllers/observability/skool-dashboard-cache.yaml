---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-skool-cache
  namespace: observability
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: skool
data:
  skool-cache-storage.json: |
    {
        "uid": "skool-cache-storage",
        "title": "Skool Storage & Cache",
        "tags": ["skool"],
        "timezone": "browser",
        "refresh": "30s",
        "time": { "from": "now-1h", "to": "now" },
        "panels": [
          {
            "title": "Cache Hit Ratio",
            "type": "gauge",
            "gridPos": { "h": 8, "w": 6, "x": 0, "y": 0 },
            "targets": [{
              "expr": "sum(rate(skool_cache_hits_total{job=\"api\"}[15m])) / (sum(rate(skool_cache_hits_total{job=\"api\"}[15m])) + sum(rate(skool_cache_misses_total{job=\"api\"}[15m])))",
              "legendFormat": "Hit Ratio"
            }],
            "fieldConfig": {
              "defaults": {
                "unit": "percentunit",
                "min": 0, "max": 1,
                "thresholds": {
                  "steps": [
                    { "value": 0, "color": "red" },
                    { "value": 0.5, "color": "yellow" },
                    { "value": 0.8, "color": "green" }
                  ]
                }
              }
            }
          },
          {
            "title": "Cache Hits vs Misses",
            "type": "timeseries",
            "gridPos": { "h": 8, "w": 18, "x": 6, "y": 0 },
            "targets": [
              {
                "expr": "sum(rate(skool_cache_hits_total{job=\"api\"}[5m]))",
                "legendFormat": "Hits/s"
              },
              {
                "expr": "sum(rate(skool_cache_misses_total{job=\"api\"}[5m]))",
                "legendFormat": "Misses/s"
              }
            ],
            "fieldConfig": { "defaults": { "unit": "ops" } }
          },
          {
            "title": "Cache Hit Rate by Endpoint",
            "type": "bargauge",
            "gridPos": { "h": 8, "w": 24, "x": 0, "y": 8 },
            "targets": [{
              "expr": "sum(rate(skool_cache_hits_total{job=\"api\"}[15m])) by (path) / (sum(rate(skool_cache_hits_total{job=\"api\"}[15m])) by (path) + sum(rate(skool_cache_misses_total{job=\"api\"}[15m])) by (path))",
              "legendFormat": "{{path}}"
            }],
            "fieldConfig": { "defaults": { "unit": "percentunit" } }
          },
          {
            "title": "Uploads (rate/s)",
            "type": "timeseries",
            "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
            "targets": [{
              "expr": "sum(rate(skool_uploads_total{job=\"api\"}[5m]))",
              "legendFormat": "Uploads/s"
            }],
            "fieldConfig": { "defaults": { "unit": "ops" } }
          },
          {
            "title": "Response Size (P95)",
            "type": "timeseries",
            "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
            "targets": [{
              "expr": "histogram_quantile(0.95, sum(rate(http_response_size_bytes_bucket{job=\"api\"}[5m])) by (le))",
              "legendFormat": "P95 response size"
            }],
            "fieldConfig": { "defaults": { "unit": "bytes" } }
          }
        ],
        "templating": { "list": [] },
        "schemaVersion": 39
      }
