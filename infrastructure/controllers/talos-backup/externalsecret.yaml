apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: talos-backup-credentials
  namespace: talos-backup
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: talos-backup-credentials
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: secret/data/kubernetes/talos-backup
        property: access-key-id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: secret/data/kubernetes/talos-backup
        property: secret-access-key
    - secretKey: AGE_X25519_PUBLIC_KEY
      remoteRef:
        key: secret/data/kubernetes/talos-backup
        property: age-public-key
