apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../config/vault-auth
  - metallb
  - ../../config/cert-manager
  - ../../config/external-dns
  # CRD-dependent resources deferred from controllers phase
  - external-dns-transip-externalsecret.yaml
  - traefik-dashboard-ingressroute.yaml
  # Applications migrated from Docker host
  - minio
  - keycloak
  - gitea
  - nexus
  # sonarqube - moved to arcturus (Docker), manifests kept for reference
  # - sonarqube
  # - sonarqube-backup
  - netbird
  - gitea-backup
  - keycloak-backup

patches:
  # Use talos01-specific Vault auth path
  - target:
      kind: ClusterSecretStore
      name: vault-backend
    patch: |
      apiVersion: external-secrets.io/v1beta1
      kind: ClusterSecretStore
      metadata:
        name: vault-backend
      spec:
        provider:
          vault:
            auth:
              kubernetes:
                mountPath: "kubernetes-talos01"
