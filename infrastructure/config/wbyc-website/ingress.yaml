apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wbyc-website
  namespace: wbyc-website
  labels:
    app.kubernetes.io/name: wbyc-website
    app.kubernetes.io/component: website
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    external-dns.alpha.kubernetes.io/external: "true"
    external-dns.alpha.kubernetes.io/target: wbyc-srv-vpn01.bsdserver.nl
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - webuildyourcloud.nl
        - www.webuildyourcloud.nl
      secretName: wbyc-website-tls
  rules:
    - host: webuildyourcloud.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wbyc-website
                port:
                  number: 80
    - host: www.webuildyourcloud.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wbyc-website
                port:
                  number: 80
