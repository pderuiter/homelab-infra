---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime
  namespace: skool
  labels:
    app.kubernetes.io/name: skool
    app.kubernetes.io/component: realtime
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: skool
      app.kubernetes.io/component: realtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skool
        app.kubernetes.io/component: realtime
    spec:
      imagePullSecrets:
        - name: skool-registry-credentials
      containers:
        - name: realtime
          image: nexus.bsdserver.nl/docker-registry/wbyc/docker-skool-realtime:1.29.14
          imagePullPolicy: Always
          ports:
            - containerPort: 4002
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: REALTIME_PORT
              value: "4002"
            - name: REDIS_URL
              value: redis://redis.skool.svc.cluster.local:6379
            - name: WEB_URL
              value: https://skool.bsdserver.nl
          envFrom:
            - secretRef:
                name: skool-api-secrets
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
---
apiVersion: v1
kind: Service
metadata:
  name: realtime
  namespace: skool
  labels:
    app.kubernetes.io/name: skool
    app.kubernetes.io/component: realtime
spec:
  selector:
    app.kubernetes.io/name: skool
    app.kubernetes.io/component: realtime
  ports:
    - port: 4002
      targetPort: http
      name: http
