---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: skool
  labels:
    app.kubernetes.io/name: skool
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: skool
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skool
        app.kubernetes.io/component: worker
    spec:
      imagePullSecrets:
        - name: skool-registry-credentials
      containers:
        - name: worker
          image: nexus.bsdserver.nl/docker-registry/wbyc/docker-skool-api:latest
          imagePullPolicy: Always
          command: ["tsx"]
          args: ["src/worker.ts"]
          env:
            - name: NODE_ENV
              value: production
            - name: REDIS_URL
              value: redis://redis.skool.svc.cluster.local:6379
          envFrom:
            - secretRef:
                name: skool-db-credentials
            - secretRef:
                name: skool-api-secrets
            - secretRef:
                name: skool-smtp-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            exec:
              command: ["node", "-e", "process.exit(0)"]
            initialDelaySeconds: 10
            periodSeconds: 60
            timeoutSeconds: 5
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
