---
# UniFi controller credentials for unpoller + custom update-exporter.
# Source: Vault path secret/unifi (written manually 2026-05-30).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: unifi-credentials
  namespace: unifi
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: unifi-credentials
    creationPolicy: Owner
  data:
    - secretKey: UNIFI_USER
      remoteRef:
        key: secret/data/unifi
        property: username
    - secretKey: UNIFI_PASS
      remoteRef:
        key: secret/data/unifi
        property: password
    - secretKey: UNIFI_HOST
      remoteRef:
        key: secret/data/unifi
        property: host
