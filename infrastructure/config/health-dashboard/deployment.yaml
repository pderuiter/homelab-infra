apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-dashboard
  namespace: health-dashboard
  labels:
    app.kubernetes.io/name: health-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: health-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: health-dashboard
    spec:
      imagePullSecrets:
        - name: nexus-registry-credentials
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: health-dashboard
          image: nexus.bsdserver.nl:443/docker-registry/health-dashboard:latest
          ports:
            - name: http
              containerPort: 5001
              protocol: TCP
          env:
            - name: DB_PATH
              value: /data/health.db
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: health-dashboard-data
