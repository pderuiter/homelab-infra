---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-skool-business
  namespace: observability
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: skool
data:
  skool-business.json: |
    {
        "uid": "skool-business",
        "title": "Skool Business Metrics",
        "tags": ["skool"],
        "timezone": "browser",
        "refresh": "1m",
        "time": { "from": "now-24h", "to": "now" },
        "panels": [
          {
            "title": "Active Users (online)",
            "type": "stat",
            "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
            "targets": [{
              "expr": "skool_active_users_total{job=\"api\"}",
              "legendFormat": "Online"
            }],
            "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "value": 0, "color": "blue" }] } } }
          },
          {
            "title": "Total Groups",
            "type": "stat",
            "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
            "targets": [{
              "expr": "skool_groups_total{job=\"api\"}",
              "legendFormat": "Groups"
            }],
            "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "value": 0, "color": "green" }] } } }
          },
          {
            "title": "Magic Links Sent (24h)",
            "type": "stat",
            "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
            "targets": [{
              "expr": "sum(increase(skool_magic_links_sent_total{job=\"api\"}[24h]))",
              "legendFormat": "Sent"
            }],
            "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "value": 0, "color": "purple" }] } } }
          },
          {
            "title": "Magic Links Verified (24h)",
            "type": "stat",
            "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
            "targets": [{
              "expr": "sum(increase(skool_magic_links_verified_total{job=\"api\"}[24h]))",
              "legendFormat": "Logins"
            }],
            "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "value": 0, "color": "green" }] } } }
          },
          {
            "title": "Signups Over Time",
            "type": "timeseries",
            "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
            "targets": [{
              "expr": "sum(increase(skool_magic_links_verified_total{job=\"api\"}[1h]))",
              "legendFormat": "Logins/hour"
            }]
          },
          {
            "title": "Posts Created",
            "type": "timeseries",
            "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
            "targets": [{
              "expr": "sum(increase(skool_posts_total{job=\"api\"}[1h]))",
              "legendFormat": "Posts/hour"
            }]
          },
          {
            "title": "Uploads Over Time",
            "type": "timeseries",
            "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
            "targets": [{
              "expr": "sum(increase(skool_uploads_total{job=\"api\"}[1h]))",
              "legendFormat": "Uploads/hour"
            }]
          },
          {
            "title": "API Request Volume (24h)",
            "type": "timeseries",
            "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
            "targets": [{
              "expr": "sum(rate(http_requests_total{job=\"api\"}[5m]))",
              "legendFormat": "Total req/s"
            }],
            "fieldConfig": { "defaults": { "unit": "reqps" } }
          },
          {
            "datasource": "Loki",
            "description": "",
            "fieldConfig": {
              "defaults": {},
              "overrides": []
            },
            "gridPos": {
              "h": 8,
              "w": 24,
              "x": 0,
              "y": 20
            },
            "id": 9999,
            "options": {
              "dedupStrategy": "none",
              "enableLogDetails": true,
              "prettifyLogMessage": false,
              "showCommonLabels": false,
              "showLabels": false,
              "showTime": true,
              "sortOrder": "Descending",
              "wrapLogMessage": false
            },
            "targets": [
              {
                "datasource": "Loki",
                "editorMode": "code",
                "expr": "{namespace=\"skool\", container=~\"api|admin-api|worker\"}",
                "queryType": "range",
                "refId": "A"
              }
            ],
            "title": "Application Logs",
            "type": "logs"
          }
        ],
        "templating": { "list": [] },
        "schemaVersion": 39
      }
