---
# UniFi controller credentials for unpoller + custom update-exporter.
# Source: Vault path secret/kubernetes/unifi (written manually 2026-05-30).
# Path under secret/kubernetes/* so it's covered by the existing
# external-secrets-policy in Vault (no policy change needed).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: unifi-credentials
  namespace: unifi
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: unifi-credentials
    creationPolicy: Owner
  data:
    - secretKey: UNIFI_USER
      remoteRef:
        key: secret/data/kubernetes/unifi
        property: username
    - secretKey: UNIFI_PASS
      remoteRef:
        key: secret/data/kubernetes/unifi
        property: password
    - secretKey: UNIFI_HOST
      remoteRef:
        key: secret/data/kubernetes/unifi
        property: host
---
# Nexus docker pull-secret, sourced from the same Vault entry the skool
# deployments already use. Needed because the update-exporter image is
# hosted at nexus.bsdserver.nl/docker-registry/.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nexus-registry-credentials
  namespace: unifi
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: nexus-registry-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ .dockerconfig }}"
      engineVersion: v2
  data:
    - secretKey: dockerconfig
      remoteRef:
        key: secret/data/kubernetes/skool/registry
        property: docker-config
