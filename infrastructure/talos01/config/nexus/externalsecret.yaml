apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nexus-credentials
  namespace: nexus
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: nexus-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: secret/data/nexus
        property: username
    - secretKey: password
      remoteRef:
        key: secret/data/nexus
        property: password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nexus-keycloak
  namespace: nexus
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: nexus-keycloak
    creationPolicy: Owner
    template:
      data:
        keycloak.json: |
          {
            "realm": "homelab",
            "auth-server-url": "https://keycloak.bsdserver.nl/",
            "ssl-required": "external",
            "resource": "{{ .client_id }}",
            "credentials": {
              "secret": "{{ .client_secret }}"
            },
            "confidential-port": 0,
            "policy-enforcer": {}
          }
  data:
    - secretKey: client_id
      remoteRef:
        key: secret/data/kubernetes/nexus-oidc
        property: oidc_client_id
    - secretKey: client_secret
      remoteRef:
        key: secret/data/kubernetes/nexus-oidc
        property: oidc_client_secret
