---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: skool
  labels:
    app.kubernetes.io/name: skool
    app.kubernetes.io/component: web
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: skool
      app.kubernetes.io/component: web
  minReadySeconds: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skool
        app.kubernetes.io/component: web
    spec:
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: skool-registry-credentials
      containers:
        - name: web
          image: nexus.bsdserver.nl/docker-registry/wbyc/docker-skool-web:1.32.2
          imagePullPolicy: Always
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: NEXT_PUBLIC_API_URL
              value: https://skool.bsdserver.nl
            - name: NEXT_PUBLIC_REALTIME_URL
              value: https://skool.bsdserver.nl
            - name: INTERNAL_API_URL
              value: http://api.skool.svc.cluster.local:4000
            - name: INTERNAL_ADMIN_API_URL
              value: http://admin-api.skool.svc.cluster.local:4001
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: skool
                    app.kubernetes.io/component: web
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: skool
  labels:
    app.kubernetes.io/name: skool
    app.kubernetes.io/component: web
spec:
  selector:
    app.kubernetes.io/name: skool
    app.kubernetes.io/component: web
  ports:
    - port: 3000
      targetPort: http
      name: http
