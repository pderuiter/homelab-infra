apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../controllers/sealed-secrets
  - ../../controllers/external-secrets
  - ../../controllers/metallb
  - ../../controllers/cert-manager
  - ../../controllers/external-dns
  # external-dns-transip: ExternalSecret moved to config phase (needs ESO CRDs)
  - external-dns-transip-namespace.yaml
  - external-dns-transip-deployment.yaml
  # Traefik: Certificate/IngressRoute moved to config phase (needs cert-manager/Traefik CRDs)
  - traefik-namespace.yaml
  - traefik-helmrepository.yaml
  - traefik-helmrelease.yaml
  - traefik-api-service.yaml

patches:
  # Traefik: remove control-plane exclusion, set talos01 loadBalancerIP, disable metrics
  - target:
      kind: HelmRelease
      name: traefik
      namespace: traefik
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: traefik
        namespace: traefik
      spec:
        values:
          affinity: {}
          service:
            spec:
              loadBalancerIP: 192.168.2.21
          metrics:
            prometheus:
              service:
                enabled: false
              serviceMonitor:
                enabled: false

  # Sealed Secrets: remove control-plane exclusion, disable ServiceMonitor
  - target:
      kind: HelmRelease
      name: sealed-secrets
      namespace: sealed-secrets
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: sealed-secrets
        namespace: sealed-secrets
      spec:
        values:
          affinity: {}
          metrics:
            serviceMonitor:
              enabled: false
