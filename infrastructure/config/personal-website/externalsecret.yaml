---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: personal-website-database
  namespace: personal-website
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: personal-website-database
    creationPolicy: Owner
    template:
      data:
        DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@postgres-cluster-rw.databases.svc.cluster.local:5432/{{ .dbname }}"
  data:
    - secretKey: username
      remoteRef:
        key: secret/kubernetes/personal-website/database
        property: username
    - secretKey: password
      remoteRef:
        key: secret/kubernetes/personal-website/database
        property: password
    - secretKey: dbname
      remoteRef:
        key: secret/kubernetes/personal-website/database
        property: dbname
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: personal-website-vllm
  namespace: personal-website
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: personal-website-vllm
    creationPolicy: Owner
  data:
    - secretKey: VLLM_API_KEY
      remoteRef:
        key: secret/kubernetes/personal-website/vllm
        property: api-key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: personal-website-smtp
  namespace: personal-website
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: personal-website-smtp
    creationPolicy: Owner
    template:
      data:
        SMTP_HOST: "{{ .host }}"
        SMTP_PORT: "{{ .port }}"
        SMTP_USER: "{{ .user }}"
        SMTP_PASSWORD: "{{ .password }}"
  data:
    - secretKey: host
      remoteRef:
        key: mailserver/smtp-service
        property: host
    - secretKey: port
      remoteRef:
        key: mailserver/smtp-service
        property: port
    - secretKey: user
      remoteRef:
        key: mailserver/smtp-service
        property: user
    - secretKey: password
      remoteRef:
        key: mailserver/smtp-service
        property: password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: personal-website-auth
  namespace: personal-website
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: personal-website-auth
    creationPolicy: Owner
  data:
    - secretKey: AUTH_SECRET
      remoteRef:
        key: secret/kubernetes/personal-website/auth
        property: auth-secret
    - secretKey: ADMIN_EMAIL
      remoteRef:
        key: secret/kubernetes/personal-website/auth
        property: admin-email
