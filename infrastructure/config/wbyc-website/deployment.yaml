apiVersion: apps/v1
kind: Deployment
metadata:
  name: wbyc-website
  namespace: wbyc-website
  labels:
    app.kubernetes.io/name: wbyc-website
    app.kubernetes.io/component: website
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: wbyc-website
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wbyc-website
    spec:
      imagePullSecrets:
        - name: nexus-registry-credentials
      containers:
        - name: nginx
          image: nexus.bsdserver.nl:443/docker-registry/website-hugo-wbyc:1.0.0
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: wbyc-website
                topologyKey: kubernetes.io/hostname
