apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: netbird
  namespace: netbird
  labels:
    app.kubernetes.io/name: netbird
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: netbird
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netbird
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # netbird must start AFTER calico-node: if netbird attaches its XDP
      # program to lo before Felix's first sync, Felix enters an infinite
      # detach loop (~1 vCPU) and degrades pod networking (incidents
      # 2026-05-18 and 2026-07-15). Felix health endpoint: localhost:9099.
      initContainers:
        - name: wait-for-calico
          image: curlimages/curl:8.14.1
          command:
            - sh
            - -c
            - |
              until curl -fsS --max-time 2 http://localhost:9099/readiness; do
                echo "calico-node not ready yet, retrying in 5s"
                sleep 5
              done
              sleep 10
              echo "calico-node ready, starting netbird"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: netbird
          image: netbirdio/netbird:0.66.3
          env:
            - name: NB_SETUP_KEY
              valueFrom:
                secretKeyRef:
                  name: netbird
                  key: NB_SETUP_KEY
            - name: NB_MANAGEMENT_URL
              valueFrom:
                secretKeyRef:
                  name: netbird
                  key: NB_MANAGEMENT_URL
            - name: NB_LOG_FILE
              value: console
            - name: NB_DAEMON_ADDR
              value: unix:///var/run/netbird.sock
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - SYS_ADMIN
                - SYS_RESOURCE
          volumeMounts:
            - name: config
              mountPath: /etc/netbird
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: config
          hostPath:
            path: /var/lib/netbird
            type: DirectoryOrCreate
      tolerations:
        - operator: Exists
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
