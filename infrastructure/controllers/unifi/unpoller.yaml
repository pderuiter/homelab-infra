---
# unpoller (formerly unifi-poller) — Prometheus exporter for UniFi controllers.
# Deployed as a plain Deployment because the upstream helm chart distribution
# (unpoller.github.io/unpoller-helm) is 404 / unmaintained as of 2026.
# Upstream image: ghcr.io/unpoller/unpoller — single binary, env-configurable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unpoller
  namespace: unifi
  labels:
    app.kubernetes.io/name: unpoller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: unpoller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unpoller
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: unpoller
          image: ghcr.io/unpoller/unpoller:v2.15.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9130
          env:
            - name: UP_UNIFI_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: unifi-credentials
                  key: UNIFI_USER
            - name: UP_UNIFI_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: unifi-credentials
                  key: UNIFI_PASS
            - name: UP_UNIFI_DEFAULT_URL
              value: "https://10.69.2.1"
            - name: UP_UNIFI_DEFAULT_VERIFY_SSL
              value: "false"
            - name: UP_UNIFI_DEFAULT_SAVE_SITES
              value: "true"
            - name: UP_UNIFI_DEFAULT_SAVE_DPI
              value: "false"
            - name: UP_POLLER_DEBUG
              value: "false"
            - name: UP_PROMETHEUS_DISABLE
              value: "false"
            - name: UP_PROMETHEUS_HTTP_LISTEN
              value: "0.0.0.0:9130"
            - name: UP_INFLUXDB_DISABLE
              value: "true"
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: unpoller
  namespace: unifi
  labels:
    app.kubernetes.io/name: unpoller
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: unpoller
  ports:
    - name: metrics
      port: 9130
      targetPort: metrics
